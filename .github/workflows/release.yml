name: Release

# 正式版发布：打 v* 标签触发，把工作流内的版本改写为标签对应版本后 deploy 到 GitHub Packages。
# 示例：tag v1.0.0 → 发布 1.0.0。样例模块不发布（samples/pom.xml 已配置 maven.deploy.skip）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Resolve version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        run: ./mvnw -B -ntp versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} versions:commit

      - name: Deploy to GitHub Packages
        run: ./mvnw -B -ntp deploy -DskipTests
