name: Release

# 正式版发布：打 v* 标签触发，把工作流内的版本改写为标签对应版本后 deploy 到 GitHub Packages。
# 示例：tag v1.0.0 → 发布 1.0.0。样例模块不发布（samples/pom.xml 已配置 maven.deploy.skip）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Resolve version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        run: ./mvnw -B -ntp versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} versions:commit

      - name: Deploy to GitHub Packages
        # -Prelease 附带 sources/javadoc/SBOM；GPG 签名待仓库配置 GPG_PRIVATE_KEY/GPG_PASSPHRASE
        # secrets 后移除 -Dgpg.skip=true（见 docs/release-guide.md）
        run: ./mvnw -B -ntp -s "$GITHUB_WORKSPACE/settings.xml" deploy -DskipTests -Prelease -Dgpg.skip=true
        # setup-java 生成的 settings.xml 以 ${env.GITHUB_TOKEN} 引用凭据，缺 env 时为空串导致 401
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
